[project]
name = "fork-ops-workspace"
version = "0.1.0"
description = "Workspace configuration for Fork Ops."
requires-python = ">=3.11"
dependencies = [
  "fork-ops[mcp]"
]

[dependency-groups]
build = [
  "setuptools==83.0.0",
  "wheel==0.46.2"
]
test = [
  "coverage>=7,<8",
  "pytest>=8.0"
]
development = [
  "pyrefly>=1.1.1,<2",
  "ruff>=0.14",
  "types-jsonschema>=4.25"
]

[tool.uv]
package = false
default-groups = ["test", "development"]

[tool.uv.sources]
fork-ops = { workspace = true }

[tool.uv.workspace]
members = ["plugins/fork-ops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["plugins/fork-ops/src", "plugins/fork-ops/tests"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyrefly]
project-includes = ["plugins/fork-ops/src", "plugins/fork-ops/tests"]
search-path = ["plugins/fork-ops/src"]
python-version = "3.11.0"
preset = "strict"
