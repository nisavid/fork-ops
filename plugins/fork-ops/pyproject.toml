[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fork-ops"
version = "0.1.0"
description = "Agentic operations for maintained repository forks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "nisavid", email = "nisavid@users.noreply.github.com" }
]
dependencies = [
  "jsonschema>=4.20"
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.29,<2"
]

[dependency-groups]
build = [
  "setuptools==83.0.0",
  "wheel==0.46.2"
]
test = [
  "coverage>=7,<8",
  "pytest>=9.0.3"
]
development = [
  "pyrefly>=1.1.1,<2",
  "ruff>=0.14",
  "types-jsonschema>=4.25"
]

[project.scripts]
fork-ops = "fork_ops.cli:main"
fork-ops-mcp = "fork_ops.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fork_ops = ["fork-ops.schema.json", "security-exception-contract-1.0.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-includes = ["src", "tests"]
search-path = ["src"]
python-version = "3.11.0"
preset = "strict"
